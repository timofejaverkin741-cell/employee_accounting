
<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Учёт сотрудников</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1100px;
            margin: 35px auto;
            padding: 0 20px;
            background: #f4f6f9;
            color: #263238;
        }
        h1 { color: #23466b; }
        .toolbar, .filters {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin: 18px 0;
        }
        input, select, button, .button {
            padding: 10px;
            border: 1px solid #ccd3dc;
            border-radius: 5px;
            font-size: 14px;
        }
        button, .button {
            background: #285b8f;
            color: white;
            cursor: pointer;
            text-decoration: none;
        }
        .delete { background: #b83232; }
        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }
        th, td {
            border: 1px solid #dce1e7;
            padding: 11px;
            text-align: left;
        }
        th { background: #e6edf5; }
        .message { padding: 12px; background: #dff3e4; }
        .error { padding: 12px; background: #f9dddd; }
        .actions { display: flex; gap: 6px; flex-wrap: wrap; }
    </style>
</head>
<body>

<h1>Учёт сотрудников</h1>

<p class="message" th:if="${successMessage}"
   th:text="${successMessage}"></p>
<p class="error" th:if="${errorMessage}"
   th:text="${errorMessage}"></p>

<div class="toolbar">
    <a class="button" th:href="@{/employees/add}">
        + Добавить сотрудника
    </a>
</div>

<form class="filters" th:action="@{/employees}" method="get">
    <input type="text" name="name"
           placeholder="Поиск по ФИО"
           th:value="${name}">

    <select name="active">
        <option value="" th:selected="${active == ''}">Все сотрудники</option>
        <option value="true" th:selected="${active == 'true'}">Активные</option>
        <option value="false" th:selected="${active == 'false'}">Неактивные</option>
    </select>

    <button type="submit">Найти</button>
    <a class="button" th:href="@{/employees}">Сбросить</a>
</form>

<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>ФИО</th>
        <th>Email</th>
        <th>Телефон</th>
        <th>Должность</th>
        <th>Зарплата</th>
        <th>Активность</th>
        <th>Действия</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="employee : ${employees}">
        <td th:text="${employee.id}"></td>
        <td th:text="${employee.fullName}"></td>
        <td th:text="${employee.email}"></td>
        <td th:text="${employee.phone}"></td>
        <td th:text="${employee.position}"></td>
        <td th:text="${employee.salary}"></td>
        <td th:text="${employee.active ? 'Активен' : 'Неактивен'}"></td>
        <td>
            <div class="actions">
                <a class="button"
                   th:href="@{/employees/edit/{id}(id=${employee.id})}">
                    Изменить
                </a>

                <form th:action="@{/employees/delete/{id}(id=${employee.id})}"
                      method="post"
                      onsubmit="return confirm('Удалить сотрудника?')">
                    <button class="delete" type="submit">Удалить</button>
                </form>
            </div>
        </td>
    </tr>

    <tr th:if="${#lists.isEmpty(employees)}">
        <td colspan="8">Сотрудники не найдены.</td>
    </tr>
    </tbody>
</table>

</body>
</html>
